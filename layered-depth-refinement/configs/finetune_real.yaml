# Stage 2: Fine-tune on Real Agricultural Data
# Prerequisite: Synthetic pretraining complete

model:
  num_layers: 3
  d_model: 256
  num_heads: 8
  dropout: 0.1
  use_foundation_fusion: true  # Use DINOv2 + Depth Anything V2
  use_dino: true
  use_depth_anything: true
  use_multiview: false

loss:
  alpha_composite: 1.0
  alpha_order: 0.1
  alpha_alpha: 0.5
  alpha_thin: 0.3

training:
  epochs: 30
  batch_size: 4
  lr: 5.0e-5  # Lower LR for fine-tuning
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 3
  grad_clip: 1.0
  pretrained: checkpoints/synthetic_best.pth

data:
  data_dir: data/real/agricultural
  image_size: [480, 848]
  max_depth: 1.0
  num_workers: 4
  mode: single  # Single camera for stage 2

augmentation:
  random_flip: true
  random_crop: false
  color_jitter: 0.1
  gaussian_noise: 0.005

logging:
  use_wandb: true
  project: layered-depth-refinement
  experiment: finetune_real
  log_interval: 20
  save_interval: 5

