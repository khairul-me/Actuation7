# Stage 1: Pretrain on Synthetic Data
# Goal: Validate layered depth concept
# Acceptance: MAE < 2mm, Layer accuracy > 90%

model:
  num_layers: 3
  d_model: 256
  num_heads: 8
  dropout: 0.1
  use_foundation_fusion: false  # Use ConvNeXt encoder for synthetic
  use_multiview: false

loss:
  alpha_composite: 1.0
  alpha_order: 0.1
  alpha_alpha: 0.5
  alpha_thin: 0.3

training:
  epochs: 50
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 5
  grad_clip: 1.0

data:
  data_dir: data/synthetic
  image_size: [480, 848]
  max_depth: 1.0
  num_workers: 4

augmentation:
  random_flip: true
  random_crop: false
  color_jitter: 0.2
  gaussian_noise: 0.01

logging:
  use_wandb: true
  project: layered-depth-refinement
  experiment: synthetic_pretrain
  log_interval: 50
  save_interval: 5

