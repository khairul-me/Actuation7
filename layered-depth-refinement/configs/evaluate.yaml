# Evaluation Configuration

model:
  num_layers: 3
  d_model: 256
  num_heads: 8
  dropout: 0.0  # No dropout at eval
  use_foundation_fusion: true
  use_multiview: true

evaluation:
  checkpoint: checkpoints/best_model.pth
  data_dir: data/real/test
  output_dir: results
  batch_size: 1
  
  baselines:
    - depth_anything_v2
    - dust3r
    - marigold
    - raw_depth
    - variance_weighted
    - median

  metrics:
    - mae
    - rmse
    - absrel
    - delta_105
    - delta_110
    - delta_125

  splits:
    - all
    - thin
    - thick

